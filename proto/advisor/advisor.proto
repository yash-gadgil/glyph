syntax = "proto3";

package advisor;

option go_package = "github.com/yash-gadgil/glyph/services/gen/golang/advisor";

service AdvisorService {
    rpc ChatWithAdvisor(ChatRequest) returns (stream AnalysisChunk) {}
    rpc GetChatSession(GetChatSessionRequest) returns (ChatSession) {}
    rpc ClearChatSession(GetChatSessionRequest) returns (ChatSession) {}
    rpc StartStrategyGeneration(StartStrategyGenerationRequest) returns (StrategyJob) {}
    rpc GetStrategyJob(GetStrategyJobRequest) returns (StrategyJob) {}
}

message AnalysisChunk {
    string text = 1;
    bool done = 2;
}

message ChatRequest {
    string user_id = 1;
    string message = 2;
    string provider = 3;
}

message GetChatSessionRequest {
    string user_id = 1;
}

message ChatTurn {
    string role = 1;
    string content = 2;
}

message ChatSession {
    repeated ChatTurn turns = 1;
    bool in_flight = 2;
    string partial_text = 3;
}

message StartStrategyGenerationRequest {
    string user_id = 1;
    string symbol = 2;
    string provider = 3;
}

message GetStrategyJobRequest {
    string user_id = 1;
}

message BacktestSummary {
    double total_return_pct = 1;
    double max_drawdown_pct = 2;
    double sharpe = 3;
    double win_rate = 4;
    double profit_factor = 5;
    int32 num_trades = 6;
}

message StrategyJob {
    string state = 1;
    string name = 2;
    string config_json = 3;
    string rationale = 4;
    BacktestSummary backtest = 5;
    string error = 6;
    string started_at = 7;
    string updated_at = 8;
}
