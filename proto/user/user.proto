syntax = "proto3";

package user;

import "google/protobuf/empty.proto";

option go_package = "github.com/yash-gadgil/glyph/services/gen/golang/user";

service WatchlistService {
    rpc GetWatchlists(UserSpecifier) returns (WatchlistsResponse) {}
    rpc GetWatchlist(WatchlistSpecifier) returns (Watchlist) {}
    rpc CreateWatchlist(CreateWatchlistRequest) returns (WatchlistSpecifier) {}
    rpc ModifyWatchlist(ModifyWatchlistRequest) returns (google.protobuf.Empty) {}
    rpc DeleteWatchlist(WatchlistSpecifier) returns (google.protobuf.Empty) {}
    rpc DeleteSymbolFromWatchlist(DeleteSymbolRequest) returns (google.protobuf.Empty) {}
}

message Watchlist {
    string id = 1;
    string user_id = 2;
    string name = 3;
    repeated string symbols = 4;
}

message WatchlistMetadata {
    string id = 1;
    string name = 2;
}

message UserSpecifier {
    string user_id = 1;
}

message WatchlistsResponse {
    string user_id = 1;
    repeated WatchlistMetadata w_metadata = 2;
    Watchlist first = 3;
}

message CreateWatchlistRequest {
    string user_id = 1;
    optional string name = 2;
}

message ModifyWatchlistRequest {
    string id = 1;
    string user_id = 2;
    enum Action {
        SUBSCRIBE = 0;
        UNSUBSCRIBE = 1;
        RENAME = 2;
    }
    Action action = 3;
    repeated string symbols = 4;
}

message WatchlistSpecifier {
    string id = 1;
    string user_id = 2;
}

message DeleteSymbolRequest {
    string id = 1;
    string user_id = 2;
    string symbol = 3;
}

service AccountService {
    rpc SignupUser(SignupUserInfo) returns (UserSpecifier) {}
    rpc SigninUser(SigninUserInfo) returns (UserSpecifier) {}
    rpc CheckEmailAvailability(CheckEmailRequest) returns (CheckEmailResponse) {}
    rpc UpdatePasswordByEmail(UpdatePasswordRequest) returns (google.protobuf.Empty) {}
    rpc GetProfile(UserSpecifier) returns (Profile) {}
    rpc AddFunds(AddFundsRequest) returns (AddFundsResponse) {}
    rpc ResetAccount(UserSpecifier) returns (google.protobuf.Empty) {}
    rpc ReserveForOrder(ReserveForOrderRequest) returns (google.protobuf.Empty) {}
    rpc ReleaseForOrder(ReleaseForOrderRequest) returns (google.protobuf.Empty) {}
}

message Profile {
    string user_id = 1;
    string email = 2;
    string user_name = 3;
}

message AddFundsRequest {
    string user_id = 1;
    int64 amount_cents = 2;
}

message AddFundsResponse {
    int64 cash_balance_cents = 1;
}

message ReserveForOrderRequest {
    string order_id = 1;
    string user_id = 2;
    string symbol = 3;
    int32 side = 4;
    int64 qty = 5;
    int64 cents_per_share = 6;
}

message ReleaseForOrderRequest {
    string order_id = 1;
}

message SignupUserInfo {
    string user_name = 1;
    string email = 2;
    optional string password = 3;
}

message SigninUserInfo {
    string email = 1;
    optional string password = 2;
}

message CheckEmailRequest {
    string email = 1;
}

message CheckEmailResponse {
    bool available = 1;
}

message UpdatePasswordRequest {
    string email = 1;
    string password_hash = 2;
}

service PortfolioService {
    rpc GetPortfolio(UserSpecifier) returns (PortfolioResponse) {}
    rpc GetHoldings(UserSpecifier) returns (HoldingsResponse) {}
    rpc GetPositions(UserSpecifier) returns (PositionsResponse) {}
    rpc GetPortfolioHistory(PortfolioHistoryRequest) returns (PortfolioHistoryResponse) {}
}

service StrategyService {
    rpc GetStrategies(UserSpecifier) returns (StrategiesResponse) {}
    rpc CreateStrategy(CreateStrategyRequest) returns (Strategy) {}
    rpc UpdateStrategy(UpdateStrategyRequest) returns (Strategy) {}
    rpc DeleteStrategy(StrategySpecifier) returns (google.protobuf.Empty) {}
    rpc DeployStrategy(DeployStrategyRequest) returns (Deployment) {}
    rpc StopDeployment(DeploymentSpecifier) returns (Deployment) {}
    rpc DeleteDeployment(DeploymentSpecifier) returns (google.protobuf.Empty) {}
    rpc GetDeployments(UserSpecifier) returns (DeploymentsResponse) {}
    rpc RunBacktest(BacktestRequest) returns (BacktestResponse) {}
}

message PortfolioHistoryRequest {
    string user_id = 1;
    int32 hours = 2;
}

message PortfolioHistoryPoint {
    int64 time_unix = 1;
    int64 equity_cents = 2;
    int64 cash_cents = 3;
    int64 market_value_cents = 4;
}

message PortfolioHistoryResponse {
    repeated PortfolioHistoryPoint points = 1;
}

message Strategy {
    string id = 1;
    string user_id = 2;
    string name = 3;
    string config_json = 4;
    string created_at = 5;
    string updated_at = 6;
}

message StrategiesResponse {
    repeated Strategy strategies = 1;
}

message CreateStrategyRequest {
    string user_id = 1;
    string name = 2;
    string config_json = 3;
}

message UpdateStrategyRequest {
    string id = 1;
    string user_id = 2;
    string name = 3;
    string config_json = 4;
}

message StrategySpecifier {
    string id = 1;
    string user_id = 2;
}

message DeployStrategyRequest {
    string strategy_id = 1;
    string user_id = 2;
    string symbol = 3;
    int64 position_size_cents = 4;
}

message DeploymentSpecifier {
    string id = 1;
    string user_id = 2;
}

message Deployment {
    string id = 1;
    string strategy_id = 2;
    string user_id = 3;
    string symbol = 4;
    int64 position_size_cents = 5;
    string status = 6;
    bool in_position = 7;
    int64 entry_price_cents = 8;
    int64 qty = 9;
    string strategy_name = 10;
    string created_at = 11;
    string updated_at = 12;
}

message DeploymentsResponse {
    repeated Deployment deployments = 1;
}

message BacktestRequest {
    string user_id = 1;
    string config_json = 2;
    string symbol = 3;
    string timeframe = 4;
    string start = 5;
    string end = 6;
    int64 initial_capital_cents = 7;
    int64 position_size_cents = 8;
}

message BacktestEquityPoint {
    int64 time_unix = 1;
    int64 equity_cents = 2;
}

message BacktestTrade {
    int64 entry_time_unix = 1;
    int64 exit_time_unix = 2;
    int64 entry_price_cents = 3;
    int64 exit_price_cents = 4;
    int64 qty = 5;
    int64 pnl_cents = 6;
    double return_pct = 7;
    int32 hold_bars = 8;
    string exit_reason = 9;
}

message BacktestResponse {
    double total_return_pct = 1;
    double max_drawdown_pct = 2;
    double sharpe = 3;
    double win_rate = 4;
    double profit_factor = 5;
    int32 num_trades = 6;
    double avg_hold_bars = 7;
    int64 final_equity_cents = 8;
    repeated BacktestEquityPoint equity_curve = 9;
    repeated BacktestTrade trades = 10;
    int32 bars_used = 11;
    int32 warmup_bars = 12;
}

message PortfolioResponse {
    int64 cash_balance_cents = 1;
    int64 reserved_cash_cents = 2;
    string currency = 3;
    int32 multiplier = 4;
    int64 margin_used_cents = 5;
}

message Holding {
    string symbol = 1;
    int64 qty = 2;
    int64 avg_price_cents = 3;
    int64 cost_basis_cents = 4;
    int64 last_price_cents = 5;
    int64 market_value_cents = 6;
    int64 unrealized_pnl_cents = 7;
    int64 realized_pnl_cents = 8;
}

message HoldingsResponse {
    repeated Holding holdings = 1;
    int64 total_market_value_cents = 2;
    int64 total_cost_basis_cents = 3;
    int64 total_unrealized_pnl_cents = 4;
    int64 total_realized_pnl_cents = 5;
}

message Position {
    string symbol = 1;
    int64 qty = 2;
    int64 reserved_qty = 3;
    int64 realized_pnl_cents = 4;
    int64 cost_basis_cents = 5;
    int64 avg_price_cents = 6;
}

message PositionsResponse {
    repeated Position positions = 1;
}
