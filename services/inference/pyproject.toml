[project]
name = "glyph-inference"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "grpcio==1.71.0",
    "protobuf==5.29.3",
]

[project.optional-dependencies]
model = [
    "transformers==4.49.0",
    "torch==2.6.0",
    "accelerate==1.4.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
