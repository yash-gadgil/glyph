apiVersion: v1
kind: PersistentVolume
metadata:
  name: order-volume
  labels:
    app: orderdb
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  claimRef:
    name: orderdb-pvc
    namespace: glyph
  hostPath:
    path: /Users/yashgadgil/Documents/Projects/glyph/.data/orderdb
    type: DirectoryOrCreate
