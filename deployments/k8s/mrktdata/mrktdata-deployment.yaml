apiVersion: apps/v1
kind: Deployment
metadata:
  name: mrktdata
  namespace: glyph
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mrktdata
  template:
    metadata:
      labels:
        app: mrktdata
    spec:
      containers:
        - name: mrktdata
          image: glyph/mrktdata:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: mrktdata-secrets
            - configMapRef:
                name: mrktdata-config
          ports:
            - containerPort: 50052
          readinessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
