apiVersion: v1
kind: PersistentVolume
metadata:
  name: strategy-volume
  labels:
    app: strategydb
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  claimRef:
    name: strategydb-pvc
    namespace: glyph
  hostPath:
    path: /Users/yashgadgil/Documents/Projects/glyph/.data/strategydb
    type: DirectoryOrCreate
