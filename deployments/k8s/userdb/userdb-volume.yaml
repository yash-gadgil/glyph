apiVersion: v1
kind: PersistentVolume
metadata:
  name: user-volume
  labels:
    app: userdb
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  claimRef:
    name: userdb-pvc
    namespace: glyph
  hostPath:
    path: /Users/yashgadgil/Documents/Projects/glyph/.data/userdb
    type: DirectoryOrCreate
