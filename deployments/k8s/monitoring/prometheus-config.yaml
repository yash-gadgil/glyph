apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: glyph
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: gateway
        static_configs:
          - targets: ['gateway:9100']
      - job_name: auth
        static_configs:
          - targets: ['auth:9100']
      - job_name: user
        static_configs:
          - targets: ['user:9100']
      - job_name: mrktdata
        static_configs:
          - targets: ['mrktdata:9100']
      - job_name: order
        static_configs:
          - targets: ['order:9100']
